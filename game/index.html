<head>

<title>The Gilded Mouse — a midnight gallery heist</title>
<style>
  html, body {
    margin: 0;

    display: flex;

    color: #64748b;

    text-align: center;
  }
  .foot b { color: #94a3b8; }

<body>
<canvas id="game"></canvas>
<p class="foot"><b>WASD / arrows</b> move &nbsp;·&nbsp; <b>Shift</b> sneak &nbsp;·&nbsp; <b>click</b> toss a coin &nbsp;·&nbsp; <b>Space</b> smoke &nbsp;·&nbsp; <b>E</b> EMP &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute</p>
